name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The plugin declares node >=20 and ships with no runtime dependencies,
        # so there is nothing to install: run the suites directly.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Suites
        run: npm test

  package:
    # The review found a published script whose directory was not in the
    # tarball. Pack, unpack, and run the shipped tests from the package itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pack
        run: npm pack
      - name: Test the packed package
        run: |
          mkdir -p /tmp/pkg
          tar -xzf *.tgz -C /tmp/pkg
          cd /tmp/pkg/package
          node test/smoke.mjs
          node test/regression.mjs
          node test/tool.mjs
