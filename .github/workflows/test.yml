name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The plugin declares node >=20 and ships with no runtime dependencies,
        # so there is nothing to install: run the suites directly.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Smoke
        run: node test/smoke.mjs
      - name: Regression
        run: node test/regression.mjs
